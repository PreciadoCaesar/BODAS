<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Si por Siempre - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
        }

        .glass {
            backdrop-filter: blur(16px);
        }
    </style>
</head>

<body class="bg-gradient-to-br from-rose-100 via-pink-50 to-purple-100 min-h-screen">
    <!-- Background Pattern -->
    <div class="fixed inset-0 opacity-10">
        <div class="absolute inset-0" style="background-image: url('data:image/svg+xml,%3Csvg width=\" 60\"
            height=\"60\" viewBox=\"0 0 60 60\" xmlns=\"http://www.w3.org/2000/svg\"%3E%3Cg fill=\"none\"
            fill-rule=\"evenodd\"%3E%3Cg fill=\"%239C92AC\" fill-opacity=\"0.1\"%3E%3Cpath d=\"M36
            34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6
            4V0H4v4H0v2h4v4h2V6h4V4H6z\"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>
    </div>

    <div class="max-w-7xl mx-auto p-6 relative z-10">
        <!-- Header -->
        <header class="glass bg-white/80 backdrop-blur-xl shadow-2xl rounded-3xl p-8 mb-10 border border-white/50">
            <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                <div class="flex items-center space-x-4">
                    <img src="WhatsApp Image 2026-02-14 at 12.00.29 PM.jpeg" alt="Si por Siempre"
                        class="w-20 h-20 rounded-2xl shadow-lg object-contain">
                    <div>
                        <h1
                            class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-rose-600 via-pink-600 to-purple-600 bg-clip-text text-transparent">
                            Si por Siempre
                        </h1>
                        <p class="text-rose-600 font-medium">Dashboard Matrimonios Simbólicos</p>
                    </div>
                </div>
                <div id="auth-status" class="flex items-center space-x-3"></div>
            </div>
        </header>

        <!-- Nueva Factura -->
        <section class="glass bg-white/70 backdrop-blur-xl shadow-2xl rounded-3xl p-8 mb-10 border border-white/50">
            <h2 class="text-3xl font-bold mb-8 text-gray-800 flex items-center gap-3">
                <i class="fas fa-plus-circle text-green-500"></i> Nueva Factura
            </h2>

            <form id="factura-form" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Servicio</label>
                    <select id="servicio-select"
                        class="w-full p-4 border-2 border-gray-200 rounded-xl focus:ring-4 focus:ring-rose-200 focus:border-rose-400 transition-all duration-300 text-lg">
                        <option value="">📍 Selecciona un servicio</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Cantidad</label>
                    <input type="number" id="cantidad" value="1" min="1" max="100"
                        class="w-full p-4 border-2 border-gray-200 rounded-xl focus:ring-4 focus:ring-green-200 focus:border-green-400 transition-all text-lg">
                </div>
                <div class="flex flex-col sm:flex-row gap-3 pt-2">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Total Manual</label>
                        <input type="number" id="total-manual" placeholder="S/ 0.00" step="0.01"
                            class="w-full p-4 border-2 border-gray-200 rounded-xl focus:ring-4 focus:ring-purple-200 focus:border-purple-400 transition-all">
                    </div>
                    <button type="submit"
                        class="bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-bold py-5 px-8 rounded-xl shadow-xl hover:shadow-2xl transform hover:-translate-y-1 transition-all duration-300 text-lg flex items-center gap-2">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </form>
            <div id="subtotal-info"
                class="mt-6 p-4 bg-gradient-to-r from-green-50 to-emerald-50 rounded-2xl border-2 border-green-100">
                <i class="fas fa-calculator text-green-500 mr-2"></i>
                <span class="font-bold text-xl text-green-700">Subtotal: S/ 0.00</span>
            </div>
        </section>

        <!-- Estadísticas -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div
                class="glass bg-gradient-to-br from-blue-50 to-indigo-50 backdrop-blur-xl p-8 rounded-3xl shadow-xl border border-blue-100 hover:shadow-2xl transition-all">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-blue-600">Hoy</p>
                        <p id="total-hoy" class="text-4xl font-bold text-blue-900 mt-2">S/ 0</p>
                    </div>
                    <i class="fas fa-sun text-4xl text-blue-500 opacity-75"></i>
                </div>
            </div>
            <div
                class="glass bg-gradient-to-br from-emerald-50 to-teal-50 backdrop-blur-xl p-8 rounded-3xl shadow-xl border border-emerald-100 hover:shadow-2xl transition-all">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-emerald-600">Semana</p>
                        <p id="total-semana" class="text-4xl font-bold text-emerald-900 mt-2">S/ 0</p>
                    </div>
                    <i class="fas fa-calendar-week text-4xl text-emerald-500 opacity-75"></i>
                </div>
            </div>
            <div
                class="glass bg-gradient-to-br from-purple-50 to-violet-50 backdrop-blur-xl p-8 rounded-3xl shadow-xl border border-purple-100 hover:shadow-2xl transition-all">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-purple-600">Total</p>
                        <p id="total-general" class="text-4xl font-bold text-purple-900 mt-2">S/ 0</p>
                    </div>
                    <i class="fas fa-coins text-4xl text-purple-500 opacity-75"></i>
                </div>
            </div>
        </section>

        <!-- Tabla -->
        <section class="glass bg-white/70 backdrop-blur-xl shadow-2xl rounded-3xl p-8 border border-white/50">
            <h2 class="text-3xl font-bold mb-8 text-gray-800 flex items-center gap-3">
                <i class="fas fa-receipt text-rose-500"></i> Últimas Facturas
            </h2>
            <div class="overflow-x-auto rounded-2xl border-2 border-gray-100">
                <table class="w-full">
                    <thead class="bg-gradient-to-r from-gray-50 to-gray-100">
                        <tr>
                            <th class="p-6 text-left font-bold text-gray-800 rounded-tl-2xl">Servicio</th>
                            <th class="p-6 text-center font-bold text-gray-800">Cant.</th>
                            <th class="p-6 text-right font-bold text-gray-800">Subtotal</th>
                            <th class="p-6 text-right font-bold text-gray-800">Total</th>
                            <th class="p-6 text-right font-bold text-gray-800 rounded-tr-2xl">Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="facturas-table" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </section>
    </div>
    <script>
        const SUPABASE_URL = 'https://ksuladbzypdvefhjkcbf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzdWxhZGJ6eXBkdmVmaGprY2JmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEwNTYzMDcsImV4cCI6MjA4NjYzMjMwN30.hH1yHwd-lN1zKw0x9CF7dmPnD1Z3vAniQArKITd65mM';

        // ✅ Crear cliente correctamente
        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        let servicios = [];

        // Inicializar
        async function init() {
            await initAuth();
            await loadServicios();
            await loadFacturas();
            setInterval(loadFacturas, 3000);
        }

        // Auth
        async function initAuth() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const authDiv = document.getElementById('auth-status');

            if (session) {
                authDiv.innerHTML = `
                <span class="flex items-center gap-2 bg-green-100 text-green-800 px-4 py-2 rounded-full text-sm font-medium">
                    <i class="fas fa-check-circle"></i> Conectado
                </span>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-5 py-2 rounded-xl font-medium transition-all">
                    <i class="fas fa-sign-out-alt mr-1"></i>Salir
                </button>
            `;
            } else {
                authDiv.innerHTML = `
                <button onclick="login()" class="bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white px-6 py-3 rounded-xl font-bold transition-all shadow-lg">
                    <i class="fas fa-lock mr-2"></i>Iniciar Sesión
                </button>
            `;
            }
        }

        window.login = async function () {
            const email = prompt('Email:');
            if (email) {
                const { error } = await supabaseClient.auth.signInWithOtp({ email });
                if (error) {
                    alert(error.message);
                } else {
                    alert('✅ Revisa tu email');
                }
            }
        }

        window.logout = async function () {
            await supabaseClient.auth.signOut();
            initAuth();
        }

        // Servicios
        async function loadServicios() {
            const { data, error } = await supabaseClient
                .from('servicios')
                .select('*');

            if (error) {
                console.error(error);
                alert(error.message);
                return;
            }

            servicios = data || [];

            const select = document.getElementById('servicio-select');
            select.innerHTML =
                '<option value="">📍 Selecciona un servicio</option>' +
                servicios.map(s =>
                    `<option value="${s.id}" data-precio="${s.precio}">
                    ${s.nombre} (S/ ${s.precio})
                </option>`
                ).join('');
        }

        // Subtotal
        document.getElementById('servicio-select')
            .addEventListener('change', updateSubtotal);

        document.getElementById('cantidad')
            .addEventListener('input', updateSubtotal);

        function updateSubtotal() {
            const servicio = document.getElementById('servicio-select').selectedOptions[0];
            const cantidad = parseInt(document.getElementById('cantidad').value) || 1;
            const precio = parseFloat(servicio?.dataset.precio) || 0;
            const subtotal = (precio * cantidad).toFixed(2);

            document.getElementById('subtotal-info').innerHTML = `
            <i class="fas fa-calculator text-green-500 mr-2"></i>
            <span class="font-bold text-xl text-green-700">
                Subtotal: S/ ${subtotal}
            </span>
        `;

            document.getElementById('subtotal-info').dataset.subtotal = subtotal;
        }

        // Guardar factura
        document.getElementById('factura-form')
            .addEventListener('submit', async (e) => {
                e.preventDefault();

                const data = {
                    servicio_id: document.getElementById('servicio-select').value,
                    cantidad: parseInt(document.getElementById('cantidad').value),
                    total: parseFloat(
                        document.getElementById('total-manual').value ||
                        document.getElementById('subtotal-info').dataset.subtotal
                    )
                };

                const { error } = await supabaseClient
                    .from('facturas')
                    .insert([data]);

                if (error) {
                    alert('❌ ' + error.message);
                } else {
                    alert('✅ ¡Factura guardada!');
                    e.target.reset();
                    updateSubtotal();
                    loadFacturas();
                }
            });

        // Facturas
        async function loadFacturas() {
            const { data: facts, error } = await supabaseClient
                .from('facturas')
                .select('*, servicios(nombre, precio)')
                .order('created_at', { ascending: false })
                .limit(50);

            if (error) {
                console.error(error);
                return;
            }

            document.getElementById('facturas-table').innerHTML =
                facts?.map(f => `
                <tr class="hover:bg-rose-50/50 transition-all group">
                    <td class="p-6 font-medium text-gray-900">
                        ${f.servicios?.nombre || ''}
                    </td>
                    <td class="p-6 text-center font-bold text-lg">
                        ${f.cantidad}
                    </td>
                    <td class="p-6 text-right font-bold text-green-600 text-xl">
                        S/ ${(f.servicios?.precio * f.cantidad || 0).toFixed(2)}
                    </td>
                    <td class="p-6 text-right font-bold text-rose-600 text-xl">
                        S/ ${parseFloat(f.total).toFixed(2)}
                    </td>
                    <td class="p-6 text-right text-sm text-gray-500">
                        ${new Date(f.created_at).toLocaleDateString('es-PE')}
                    </td>
                </tr>
            `).join('') ||
                '<tr><td colspan="5" class="p-12 text-center text-gray-500">Sin facturas aún</td></tr>';

            const hoy = facts?.filter(f =>
                new Date(f.created_at).toDateString() === new Date().toDateString()
            ).reduce((sum, f) => sum + parseFloat(f.total), 0) || 0;

            const semana = facts?.filter(f => {
                const fecha = new Date(f.created_at);
                return (new Date() - fecha) <= 7 * 24 * 60 * 60 * 1000;
            }).reduce((sum, f) => sum + parseFloat(f.total), 0) || 0;

            const total = facts?.reduce((sum, f) =>
                sum + parseFloat(f.total), 0) || 0;

            document.getElementById('total-hoy').textContent = `S/ ${hoy.toFixed(0)}`;
            document.getElementById('total-semana').textContent = `S/ ${semana.toFixed(0)}`;
            document.getElementById('total-general').textContent = `S/ ${total.toFixed(0)}`;
        }

        supabaseClient.auth.onAuthStateChange(() => {
            initAuth();
            loadFacturas();
        });

        // INICIAR
        init();
    </script>

</body>

</html>
